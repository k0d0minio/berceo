name: CI

# Checks the repo on every pull request, and on main so the default branch stays
# known-good. Nothing here needs a database, and nothing here builds: `next build`
# is Vercel's, read through its commit status (`AGENTS.md` → Standing rules).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One run per branch; a new push supersedes the one still in flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheapest first, so an obvious mistake fails fast.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
