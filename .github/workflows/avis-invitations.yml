# The invitation to rate a terminée garde (avis-etoiles, D-120).
#
# Vercel Cron runs only on production deployments, never on the `uat` custom
# environment the founders test on, so the schedule lives here and calls the
# route on both. It runs every hour at :17: a garde ends on the hour or the
# half hour (it starts between 18:00 and 23:00, on the hour or the half), so
# its invitations leave within the hour after it becomes terminée. Each side
# is claimed once, so a delayed or repeated run sends nothing twice.
# It shares the digest's secret, CRON_SECRET (D-68): the same value is set on
# each Vercel environment and as this repository's secret. While it is missing
# the run is skipped with a warning, never a failure; so is a 404 from an
# environment the route has not reached yet.
name: Avis invitations

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: avis-invitations
  cancel-in-progress: false

jobs:
  invitations:
    name: Invitations (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: uat
            url: https://uat.berceo.be
          - environment: production
            url: https://www.berceo.be
    steps:
      - name: Call the invitation route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL: ${{ matrix.url }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set: the $URL invitations are skipped."
            exit 0
          fi
          # Until the batch carrying the route is promoted, production answers 404: skipped, not failed.
          code=$(curl --silent --show-error --max-time 60 -o response.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$URL/api/cron/avis-invitations")
          cat response.json; echo
          if [ "$code" = "404" ]; then
            echo "::warning::$URL has no invitation route yet: skipped."
            exit 0
          fi
          [ "$code" = "200" ] || { echo "::error::$URL answered $code"; exit 1; }
