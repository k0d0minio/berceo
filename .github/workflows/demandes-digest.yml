# The daily digest of new care requests (demande-de-garde, D-61, D-62).
#
# Vercel Cron runs only on production deployments, never on the `uat` custom
# environment the founders test on, so the schedule lives here and calls the
# route on both. It runs at 16:00 and 17:00 UTC: the route sends only from
# 18:00 in Brussels (16:00 UTC in summer, 17:00 UTC in winter) and once a day
# at most, so the other call of the day sends nothing.
# One secret, CRON_SECRET, is shared by both environments (D-68): the same
# value is set on each Vercel environment and as this repository's secret.
# While it is missing the run is skipped with a warning, never a failure; so is
# a 404 from an environment the route has not reached yet.
name: Demandes digest

on:
  schedule:
    - cron: "0 16,17 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: demandes-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Digest (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: uat
            url: https://uat.berceo.be
          - environment: production
            url: https://www.berceo.be
    steps:
      - name: Call the digest route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL: ${{ matrix.url }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set: the $URL digest is skipped."
            exit 0
          fi
          # Until the batch carrying the route is promoted, production answers 404: skipped, not failed.
          code=$(curl --silent --show-error --max-time 60 -o response.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$URL/api/cron/demandes-digest")
          cat response.json; echo
          if [ "$code" = "404" ]; then
            echo "::warning::$URL has no digest route yet: skipped."
            exit 0
          fi
          [ "$code" = "200" ] || { echo "::error::$URL answered $code"; exit 1; }
